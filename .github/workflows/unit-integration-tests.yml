name: Unit & Integration Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  compile-check:
    name: Compile Check (All Crates)
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check api_server
        working-directory: rust
        run: cargo check -p api_server

      - name: Check website
        working-directory: rust
        run: cargo check -p website

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run unit tests
        working-directory: rust
        run: cargo test -p cloudless_core --lib

  integration-tests:
    name: Integration Tests (E2E)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloudless
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/cloudless"
      JWT_SECRET: "ci-test-secret"
      PORT: "9099"
      HOST: "0.0.0.0"
      API_BASE_URL: "http://localhost:9099"
      TEST_S3_ACCESS_KEY: ${{ secrets.TEST_S3_ACCESS_KEY }}
      TEST_S3_SECRET: ${{ secrets.TEST_S3_SECRET }}
      TEST_S3_REGION: ${{ vars.TEST_S3_REGION }}
      TEST_S3_BUCKET: ${{ vars.TEST_S3_BUCKET }}
      CLOUDLESS_SFTP_TEST_HOST: "127.0.0.1"
      CLOUDLESS_SFTP_TEST_PORT: "2223"
      CLOUDLESS_SFTP_TEST_USERNAME: "cloudless"
      CLOUDLESS_SFTP_TEST_PASSWORD: "password"
      CLOUDLESS_SFTP_TEST_REMOTE_ROOT: "/upload/cloudless"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run database migrations
        working-directory: rust/api_server
        run: sqlx migrate run --source migrations

      - name: Build API server
        working-directory: rust
        run: cargo build -p api_server

      - name: Start API server
        working-directory: rust
        run: cargo run -p api_server &

      - name: Wait for API server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9099/health > /dev/null 2>&1; then
              echo "API server is ready (took ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "API server failed to start within 30s"
          exit 1

      - name: Start SFTP server
        run: |
          set -euo pipefail

          SFTP_DIR="/tmp/cloudless-ci-sftp"
          SFTP_CONTAINER="cloudless-ci-sftp"

          rm -rf "$SFTP_DIR"
          mkdir -p "$SFTP_DIR/upload/cloudless"
          chmod -R 0777 "$SFTP_DIR/upload"
          ssh-keygen -t ed25519 -N "" -f "$SFTP_DIR/id_ed25519"

          docker rm -f "$SFTP_CONTAINER" >/dev/null 2>&1 || true
          docker run -d \
            --name "$SFTP_CONTAINER" \
            -p "127.0.0.1:${CLOUDLESS_SFTP_TEST_PORT}:22" \
            -v "$SFTP_DIR/id_ed25519.pub:/home/${CLOUDLESS_SFTP_TEST_USERNAME}/.ssh/keys/id_ed25519.pub:ro" \
            -v "$SFTP_DIR/upload:/home/${CLOUDLESS_SFTP_TEST_USERNAME}/upload" \
            atmoz/sftp:latest \
            "${CLOUDLESS_SFTP_TEST_USERNAME}:${CLOUDLESS_SFTP_TEST_PASSWORD}:::upload"

          for i in $(seq 1 30); do
            if docker logs "$SFTP_CONTAINER" 2>&1 | grep -q "Server listening"; then
              echo "SFTP server is ready (took ${i}s)"
              {
                echo "CLOUDLESS_SFTP_TEST_PRIVATE_KEY<<EOF"
                cat "$SFTP_DIR/id_ed25519"
                echo "EOF"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done

          echo "SFTP server failed to start within 30s"
          docker logs "$SFTP_CONTAINER" || true
          exit 1

      - name: Verify test storage configuration
        run: |
          echo "TEST_S3_REGION=${TEST_S3_REGION:-<not set>}"
          echo "TEST_S3_BUCKET=${TEST_S3_BUCKET:-<not set>}"
          echo "TEST_S3_ACCESS_KEY is $([ -n "$TEST_S3_ACCESS_KEY" ] && echo 'set' || echo 'NOT SET')"
          echo "TEST_S3_SECRET is $([ -n "$TEST_S3_SECRET" ] && echo 'set' || echo 'NOT SET')"
          echo "CLOUDLESS_SFTP_TEST_HOST=${CLOUDLESS_SFTP_TEST_HOST}"
          echo "CLOUDLESS_SFTP_TEST_PORT=${CLOUDLESS_SFTP_TEST_PORT}"
          echo "CLOUDLESS_SFTP_TEST_USERNAME=${CLOUDLESS_SFTP_TEST_USERNAME}"
          echo "CLOUDLESS_SFTP_TEST_REMOTE_ROOT=${CLOUDLESS_SFTP_TEST_REMOTE_ROOT}"
          echo "CLOUDLESS_SFTP_TEST_PASSWORD is $([ -n "$CLOUDLESS_SFTP_TEST_PASSWORD" ] && echo 'set' || echo 'NOT SET')"
          echo "CLOUDLESS_SFTP_TEST_PRIVATE_KEY is $([ -n "$CLOUDLESS_SFTP_TEST_PRIVATE_KEY" ] && echo 'set' || echo 'NOT SET')"

      - name: Run SFTP adaptor integration tests
        working-directory: rust
        run: RUST_LOG=error cargo test -p cloudless_core --test sftp_storage_adaptor -- --ignored --nocapture

      - name: Run integration tests
        working-directory: rust
        run: RUST_LOG=error cargo test -p cloudless_core --test e2e_backup_restore -- --nocapture

      - name: Stop SFTP server
        if: always()
        run: docker rm -f cloudless-ci-sftp >/dev/null 2>&1 || true
