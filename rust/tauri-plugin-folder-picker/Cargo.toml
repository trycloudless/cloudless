[package]
name = "tauri-plugin-folder-picker"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-folder-picker"

[build-dependencies]
tauri-plugin = { version = "2.4", features = ["build"] }

[dependencies]
tauri = { version = "2.1.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.1.1", features = ["wry"], default-features = false }
