[package]
name = "leptos_ui"
version = "0.6.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
api_types = { path = "../api_types" }
shared_ui = { path = "../shared_ui", features = ["theme"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.50"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["console", "Window", "Request", "RequestInit", "RequestMode", "Response", "Headers", "FormData", "HtmlFormElement", "Storage", "Blob", "Url", "Document", "HtmlAnchorElement", "Element"] }
js-sys = "0.3"
uuid = { version = "1.19.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
