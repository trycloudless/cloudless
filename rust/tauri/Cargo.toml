[package]
name = "cloudless_tauri"
version = "0.6.0"
edition = "2021"

[lib]
name = "tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "cloudless"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.10", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cloudless_core = { path = "../core" }
api_types = { path = "../api_types" }
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7"
url = "2"
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = { version = "0.6.4", features = ["std"] }
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v7"] }
dirs = "6"
tauri-plugin-log = "2"
log = "0.4"
tracing = "0.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-folder-picker = { path = "../tauri-plugin-folder-picker" }
tauri-plugin-store = "2"
reqwest = { version = "0.13.1", features = ["json"] }
sha2 = "0.10.9"
base64 = "0.22"
rand = { version = "0.9.2", features = ["std"] }
# update when 0.2.8 is published
tauri-plugin-biometry = { git = "https://github.com/rohitbishnoi/tauri-plugin-biometry", rev = "49848154cfb6c34390316f190f9ce0bea23ca811" }
zeroize = "1"
rustls-platform-verifier = "0.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
hostname = "0.4"
machine-uid = "0.5"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"

[features]
e2e = ["tauri-plugin-webdriver", "cloudless_core/e2e"]

[dependencies.tauri-plugin-webdriver]
version = "0.2"
optional = true

[build-dependencies]
tauri-build = "2"
dotenvy = "0.15"
