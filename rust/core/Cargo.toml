[package]
name = "cloudless_core"
version = "0.1.0"
edition = "2024"

[features]
e2e = []

[dependencies]
api_types = { path = "../api_types" }
async-stream = "0.3.6"
aws-sdk-s3 = "1.104.0"
aws-smithy-http-client = { version = "1.1.1", features = ["rustls-ring"] }
webpki-root-certs = "0.26"
async-trait = "0.1.89"
bytes = "1.11.0"
chrono = { version = "0.4.41", features = ["serde"] }
dirs = "6"
futures = "0.3.31"
futures-core = "0.3.31"
mime = "0.3.17"
sha2 = "0.10.9"
tokio = { version = "1.47.1", features = ["full"] }
tokio-util = "0.7"
thiserror = "2.0.16"
zstd = "0.13.3"
aes-gcm = { version = "0.10.3", features = ["std"] }
rand_core = { version = "0.6.4", features = ["std"] }
rand = { version = "0.9.2", features = ["std"] }
argon2 = { version = "0.5.3", features = ["std"] }
base64 = "0.22"
data-encoding = "2"
russh = "0.61"
russh-sftp = "2.3"
hkdf = "0.12"
hmac = "0.12"
zeroize = "1.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
uuid =  { version = "1.19.0", features = ["v7", "v5"]}
hex = "0.4.3"
walkdir = "2.5.0"
globset = "0.4"
reqwest = {version = "0.13.1", features = ["json", "multipart", "form", "query"]  }
url = "2"
percent-encoding = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full"] }
tempfile = "3"
rand = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
