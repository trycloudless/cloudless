[package]
name = "api_server"
version = "0.1.0"
edition = "2024"

[lib]
name = "api_server"
path = "src/lib.rs"

[[bin]]
name = "api_server"
path = "src/main.rs"

[dependencies]
cloudless_core = { path = "../core" }
api_types = { path = "../api_types" }
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
base64 = "0.22"
async-trait = "0.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
jsonwebtoken = {version = "10.2.0", features = ["aws_lc_rs"]}
argon2 = "0.5.3"
rand = "0.9.2"
hex = "0.4.3"
chrono = "0.4.43"
sha2 = "0.10.9"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tera = "1"
aws-sdk-sesv2 = "1"
aws-config = "1"
aws-sdk-s3 = "1.104.0"
dotenvy = "0.15"
envy = "0.4"
thiserror = "2"
